openapi: 3.1.0
info:
  title: Keezen Game API
  version: 1.0.0
  description: |
    OpenApi definition for the Keezen board game.
    This API manages players, games, moves, and cards.

servers:
  - url: /
    description: Same origin as the deployed app (local dev runs at http://localhost:4200)

paths:
  /games:
    get:
      summary: List all active games
      description: Get stats like number of players, max nr players, is the game playing.
      operationId: getAllGames
      tags:
        - games
      responses:
        '200':
          description: A list of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameInfo'
    post:
      summary: Create a new game
      description: |
        To start playing:
        1. Create a game
        2. Add players
        3. Start the game
      operationId: createNewGame
      tags:
        - games
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewGameRequest'
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCreatedResponse'
        '400':
          description: Invalid request (e.g. room name missing or shorter than 3 characters)
        '409':
          description: Game already exists with that name

  /games/{sessionId}:
    post:
      summary: Start a game
      operationId: startGame
      tags:
        - games
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Game was started
        '404':
          description: Game could not be found
        '409':
          description: Game was already started
    delete:
      summary: Stop a game
      operationId: stopGame
      tags:
        - games
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '204':
          description: Game was stopped
        '404':
          description: Game could not be found in order to stop it
    get:
      summary: Get details of a specific game
      operationId: getGame
      tags:
        - games
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameInfo'
        '404':
          description: Game not found
  /games/{sessionId}/players/{playerId}:
    delete:
      summary: Remove a player from a game (player leaves voluntarily)
      operationId: leaveGame
      tags:
        - players
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/playerId'
      responses:
        '204':
          description: Player left the game; cards forfeited and player marked permanently inactive
        '404':
          description: Game or player not found

  /games/{sessionId}/players:
    get:
      summary: Get all players in a game
      operationId: getAllPlayersInGame
      tags:
        - players
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: An array of all players in the session
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Player'
        '400':
          description: Game not found
    post:
      summary: Add a player to a game
      operationId: addPlayerToGame
      tags:
        - players
      parameters:
        - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Player'
      responses:
        '201':
          description: "Player was added successfully"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerAddedResponse'
        '400':
          description: "Player could not be added"
        '409':
          description: Game already started, or a player with that id/name is already in the game
  /moves/{sessionId}/last:
    get:
      summary: Get the last move made in the game
      description: Used by the client to animate the most recent move.
      operationId: getLastMove
      tags:
        - moves
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: The last move that was made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
        '204':
          description: No move has been made in this game yet. No response body.
        '404':
          description: Game not found. No response body.
  /moves/{sessionId}/{playerId}:
    post:
      summary: make a move for a player
      operationId: makeMove
      tags:
        - moves
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: |
            Move evaluated. The MoveResponse `result` field indicates whether the move
            is legal (CAN_MAKE_MOVE) or rejected by the rules (see `rejectionReason`).
            A rules-rejected move is still returned as 200, not as a 4xx.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
        '400':
          description: Malformed request (game not found, not the player's turn, or missing card/pawn selection). No response body.

  /moves/{sessionId}/{playerId}/test:
    post:
      summary: check if a move for a player is possible
      operationId: checkMove
      tags:
        - moves
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/playerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
      responses:
        '200':
          description: Move checked; returns the tiles to highlight (empty when no move is possible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMoveResponse'
        '400':
          description: Malformed request (game not found, or missing card/pawn selection). No response body.
        '500':
          description: Internal error while evaluating the move. No response body.
  /cards/{sessionId}:
    get:
      summary: Get all card info that is publicly available
      operationId: getPubliclyAvailableCardInformation
      description: >
        - Number of cards already played (for displaying the played cards stack)
        - Number of cards each player has left
      tags:
        - cards
      parameters:
        - $ref: '#/components/parameters/sessionId'
      responses:
        '200':
          description: get all cards info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '404':
          description: not found

  /cards/{sessionId}/{playerId}:
    get:
      summary: Get cards for a specific player
      operationId: getPlayerCards
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/playerId'
      tags:
        - cards
      responses:
        '200':
          description: List of cards for the player
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
        '400':
          description: Missing sessionId or playerId
        '404':
          description: Game not found
        '500':
          description: Game has no card deck (unexpected server state)

    delete:
      summary: Player forfeits cards
      operationId: playerForfeits
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/playerId'
      tags:
        - cards
      responses:
        '200':
          description: player forfeited successfully
        '400':
          description: player could not forfeit

  /trade/{sessionId}:
    post:
      summary: Team card trade — request, accept, reject or cancel a King/Ace swap
      operationId: teamTrade
      parameters:
        - $ref: '#/components/parameters/sessionId'
      tags:
        - trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeAction'
      responses:
        '200':
          description: Trade action applied
        '400':
          description: Trade action was not allowed
        '404':
          description: Game not found
  /gamestates/{sessionId}:
    get:
      summary: Get gamestate of a specific game
      operationId: getGameStateForGame
      tags:
        - gamestates
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - name: stateVersion
          in: query
          description: The version of the game state currently held by the client
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Gamestate (new version)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '304':
          description: Game state not modified (client is up-to-date)
        '404':
          description: Game not found

  /gamestates/{sessionId}/{playerId}/stream:
    get:
      summary: Subscribe to realtime game-state updates (Server-Sent Events)
      description: |
        Opens a Server-Sent Events (`text/event-stream`) connection that pushes a
        personalized game-state snapshot whenever the game changes. Each event is
        named `gamestate` and its `data` is a `GameStatePush` JSON object.

        This is a long-lived streaming endpoint — consume it with an `EventSource`
        client, not a generated request/response client. OpenAPI cannot express SSE
        framing, so the schema below describes the payload of a single `gamestate`
        event, not the stream as a whole. If the game does not exist the stream opens
        and completes immediately rather than returning an error.
      operationId: streamGameState
      # x-internal makes openapi-generator SKIP this operation: it is hand-implemented
      # by adg.services.SseController (returns an SseEmitter, which the generator cannot
      # model), and generating a controller for it would collide with that route. The
      # operation stays here purely as the documented contract for the realtime stream.
      x-internal: true
      tags:
        - realtime
      parameters:
        - $ref: '#/components/parameters/sessionId'
        - $ref: '#/components/parameters/playerId'
      responses:
        '200':
          description: An open SSE stream; each `gamestate` event carries a GameStatePush.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/GameStatePush'

  /game-options:
    get:
      summary: Get available game options
      description: >
        Returns the configurable options this game supports, including type,
        description, and default value. Intended for lobby UIs to discover and
        display options before a game is created.
      operationId: getGameOptions
      tags:
        - games
      responses:
        '200':
          description: List of configurable game options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameOption'

components:
  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    playerId:
      name: playerId
      in: path
      required: true
      schema:
        type: string
  schemas:
    MoveType:
      type: string
      enum:
        - switch
        - onBoard
        - move
        - split
    GameInfo:
      type: object
      required:
        - id
        - roomName
        - nrPlayers
        - maxNrPlayers
        - status
      properties:
        id:
          type: string
        roomName:
          type: string
        nrPlayers:
          type: integer
        maxNrPlayers:
          type: integer
        status:
          type: string
          enum:
            - waiting
            - inProgress
    PawnId:
      type: object
      required:
        - playerId
        - pawnNr
      properties:
        playerId:
          type: string
        pawnNr:
          type: integer

    PositionKey:
      type: object
      required:
        - playerId
        - tileNr
      properties:
        playerId:
          type: string
        tileNr:
          type: integer

    Pawn:
      type: object
      required:
        - playerId
        - pawnId
        - currentTileId
        - nestTileId
      properties:
        playerId:
          type: string
        pawnId:
          $ref: '#/components/schemas/PawnId'
        currentTileId:
          $ref: '#/components/schemas/PositionKey'
        nestTileId:
          $ref: '#/components/schemas/PositionKey'
        uri:
          type: string

    Player:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        profilePic:
          type: string
        color:
          description: Color is HEX
          type: string
        isActive:
          type: boolean
        isPlaying:
          type: boolean
        place:
          description: standard value -1, if they won they are either 1st 2nd 3rd
          type: integer
        playerInt:
          description: under the hood this is player 0 til player 8, this makes it easier to see who is the next player etc.
          type: integer
        teamId:
          description: 0-based team index in team play (0 = Team A, 1 = Team B); null when teams are off
          type: integer

    GameState:
      type: object
      required:
        - currentPlayerId
        - pawns
        - players
        - winners
        - version
      properties:
        currentPlayerId:
          type: string
        pawns:
          type: array
          items:
            $ref: '#/components/schemas/Pawn'
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        winners:
          type: array
          items:
            type: string
#            $ref: '#/components/schemas/Player'
        version:
          description: this way the client can ask the verser if they need to update anything
          type: integer
          format: int64
        lastMoveResponse:
          $ref: '#/components/schemas/MoveResponse'

    GameStatePush:
      type: object
      description: |
        Personalized game-state snapshot pushed over the SSE stream. Extends the
        public GameState fields with the receiving player's private card hand,
        public card counts, and whether they may forfeit right now.
      required:
        - currentPlayerId
        - pawns
        - players
        - winners
        - version
      properties:
        currentPlayerId:
          type: string
        pawns:
          type: array
          items:
            $ref: '#/components/schemas/Pawn'
        players:
          type: array
          items:
            $ref: '#/components/schemas/Player'
        winners:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
        lastMoveResponse:
          $ref: '#/components/schemas/MoveResponse'
        playedCards:
          type: array
          items:
            type: string
          description: Public — cards already played (for the played-cards stack)
        nrOfCardsPerPlayer:
          type: object
          additionalProperties:
            type: integer
          description: Public — number of cards each player has left, keyed by playerId
        playerCards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          description: Private — the receiving player's own hand
        canForfeit:
          type: boolean
          description: Whether this player is allowed to forfeit their turn right now
        canRequestTrade:
          type: boolean
          description: >
            Whether this player may open a team card trade right now — drives the "ask for a
            King/Ace" button. True only in a started team game with the trade option on, no trade
            pending, when the player has a teammate and cards and has not yet played a card this
            round (the trade window closes on your first play).
        teamCardTrade:
          type: boolean
          description: Whether the King/Ace team trade sub-option is enabled (drives the Ask button)
        trade:
          $ref: '#/components/schemas/Trade'

    Trade:
      type: object
      description: |
        A pending team card-trade (present only while one is open). The requester is asking their
        teammate for a King or Ace. Each side is filled in as that player picks, in either order:
        the swap happens the moment both are present, so a trade only lingers while one half is
        still missing.
      required:
        - requesterId
        - teammateId
      properties:
        requesterId:
          type: string
          description: The player who asked for a King/Ace
        teammateId:
          type: string
          description: The teammate being asked
        offeredCard:
          $ref: '#/components/schemas/Card'
          description: >-
            What the requester gives in return. Absent until they have picked; they may pick
            again to change it, right up until the swap goes through.
        answeredCard:
          $ref: '#/components/schemas/Card'
          description: >-
            The King or Ace the teammate has committed. Absent until they have given one; they
            too may pick again while the other half is still missing.

    TradeAction:
      type: object
      description: |
        A team card-trade action from a player. REQUEST asks the teammate at once, carrying no
        card. OFFER (the requester) and ACCEPT (the teammate) then name each half of the swap, in
        whichever order they come — the trade completes as soon as both have landed. Either side
        may repeat their action to change their card while the other half is still missing.
        REJECT and CANCEL clear the trade outright.
      required:
        - action
        - playerId
      properties:
        action:
          type: string
          enum:
            - REQUEST
            - OFFER
            - ACCEPT
            - REJECT
            - CANCEL
        playerId:
          type: string
        card:
          $ref: '#/components/schemas/Card'
          description: The card given in return (OFFER) or the King/Ace handed over (ACCEPT)

    GameOption:
      type: object
      required:
        - key
        - label
        - description
        - type
        - defaultValue
      properties:
        key:
          type: string
          description: Identifier used when sending options in NewGameRequest
        label:
          type: string
          description: Short human-readable name for display in a lobby UI
        description:
          type: string
          description: Explanation of what the option does
        type:
          type: string
          enum: [BOOLEAN, INTEGER, ENUM]
        defaultValue:
          type: string
          description: Default value serialised as a string
        labelKey:
          type: string
          description: i18n key for the label, looked up in the game server's /i18n/{lang}.json
        descriptionKey:
          type: string
          description: i18n key for the description, looked up in the game server's /i18n/{lang}.json
        choices:
          type: array
          items:
            type: string
          description: Allowed values — only relevant for ENUM type
        minValue:
          type: integer
          description: Minimum value — only relevant for INTEGER type
        maxValue:
          type: integer
          description: Maximum value — only relevant for INTEGER type

    GameCreatedResponse:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          description: Identifier of the newly created game session

    PlayerAddedResponse:
      type: object
      required:
        - playerId
      properties:
        playerId:
          type: string
          description: Identifier of the player that was added to the game

    NewGameRequest:
      type: object
      required:
        - roomName
        - maxPlayers
      properties:
        roomName:
          type: string
          minLength: 3
          maxLength: 50
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 8
        playerId:
          type: string
        gameOptions:
          type: object
          additionalProperties: {}
          description: Optional key-value map of game settings (e.g. {"exactMoveRequired":true})

    MoveRequest:
      type: object
      description: |
        only uses Id's for pawns and Cards so that the Server
        is required to check their real state and not accidentally trust the client.
      required:
        - playerId
      properties:
        playerId:
          type: string
        cardId:
          type: integer
        pawn1Id:
          $ref: '#/components/schemas/PawnId'
        pawn2Id:
          $ref: '#/components/schemas/PawnId'
        moveType:
          $ref: '#/components/schemas/MoveType'
        stepsPawn1:
          type: integer
        stepsPawn2:
          type: integer
        tempMessageType:
          description: only temporary, to give it test/make_move functionality in order to make the switch to openapi easier
          $ref: '#/components/schemas/TempMessageType'
    TempMessageType:
      description: only temporary, to give it test/make_move functionality in order to make the switch to openapi easier
      type: string
      enum:
        - CHECK_MOVE
        - MAKE_MOVE
    Card:
      type: object
      required:
        - suit
        - value
        - uuid
      properties:
        suit:
          description: |
            there is 1 suite per player
            with a maximum of 4 suites (0,1,2,3)
          type: integer
          minimum: 0
          maximum: 3
        value:
          description: the face value of the card 1 = ace, ... , 12 = king
          type: integer
        uuid:
          description: |
            a unique tracking number to distinguish between two identical cards (Ace♠︎),
            this happens when you have more than 4 players.
          type: integer
    MoveResult:
      type: string
      enum:
        - CAN_MAKE_MOVE
        - CANNOT_MAKE_MOVE
        - PLAYER_DOES_NOT_HAVE_CARD
        - INVALID_SELECTION
    MoveRejectionReason:
      description: |
        Specific reason a move was rejected, so the client can explain to the player why
        the move could not be made. NONE means no rejection (the move was valid).
      type: string
      enum:
        - NONE
        - INVALID_SELECTION
        - DONT_HAVE_CARD
        - WRONG_CARD_FOR_MOVE
        - PAWN_ON_NEST
        - PAWN_NOT_ON_NEST
        - PAWN_NOT_ON_BOARD
        - NOT_YOUR_PAWN
        - DESTINATION_OCCUPIED_BY_OWN_PAWN
        - DESTINATION_BLOCKED
        - START_TILE_OCCUPIED
        - CANNOT_PASS_START_TILE
        - CANNOT_SWITCH_OPPONENT_ON_OWN_START
        - CANNOT_SWITCH_OWN_PAWNS
        - MUST_MOVE_EXACT_STEPS
        - PAWN_CLOSED_IN_FINISH
        - SPLIT_NEEDS_TWO_OWN_PAWNS
        - SPLIT_STEPS_NOT_SEVEN
        - MUST_FINISH_OWN_PAWNS_FIRST
        - CANNOT_MOVE_OUT_OF_FINISH
    MoveSet:
      type: array
      items:
        $ref: '#/components/schemas/PositionKey'
    TestMoveResponse:
      type: object
      description:
        only returns PositionKeys you need to highlight for possible moves
      properties:
        tiles:
          $ref: '#/components/schemas/MoveSet'
        # For a 7-split: the recommended step allocation that lands a pawn deepest in the finish.
        # Only set when the selection is a valid 7-split and at least one allocation reaches the
        # finish; otherwise omitted (client keeps its 0/7 default). Pawn order is never changed.
        recommendedStepsPawn1:
          type: integer
        recommendedStepsPawn2:
          type: integer
    MoveResponse:
      type: object
      description:
        when you use 7 you could kill 2 opponents at the same time
      properties:
        # pawns
        pawn1:
          $ref: '#/components/schemas/Pawn'
        pawn2:
          $ref: '#/components/schemas/Pawn'
        pawnKilledByPawn1:
          $ref: '#/components/schemas/Pawn'
        pawnKilledByPawn2:
          $ref: '#/components/schemas/Pawn'
        # move sets
        movePawn1:
          $ref: '#/components/schemas/MoveSet'
        movePawn2:
          $ref: '#/components/schemas/MoveSet'
        movePawnKilledByPawn1:
          $ref: '#/components/schemas/MoveSet'
        movePawnKilledByPawn2:
          $ref: '#/components/schemas/MoveSet'
        # move type
        moveType:
          $ref: '#/components/schemas/MoveType'
        result:
          $ref: '#/components/schemas/MoveResult'
        # rejection detail (only meaningful when result is not CAN_MAKE_MOVE)
        rejectionReason:
          $ref: '#/components/schemas/MoveRejectionReason'
        rejectionDetail:
          description: |
            Optional numeric detail for a rejection — e.g. for MUST_MOVE_EXACT_STEPS it is the
            number of steps the pawn can actually move ("you can only move X steps").
          type: integer

    CardResponse:
      type: object
      properties:
        playedCards:
          type: array
          items:
            type: string
        nrOfCardsPerPlayer:
          type: object
          additionalProperties: #for a flexible key value mapping
            type: integer