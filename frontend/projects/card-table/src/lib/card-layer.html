<!-- Cards live in their own layer, overlaid on the play area so the pile lines up with the centre
     and the hand sits below. Same DOM element per uuid (stable track), so moving a card between
     hand / pile / deck animates it (a FLIP). Flyers are transient cards mid-flight. The table's
     timings are published as CSS vars, so the transitions and keyframes follow the engine. -->
<div
  class="card-layer"
  [style.--ct-fly-ms]="table().timing.flyMs + 'ms'"
  [style.--ct-pop-ms]="table().timing.popMs + 'ms'"
  [style.--ct-deal-flip-ms]="table().timing.dealFlipMs + 'ms'"
  [style.--ct-deck-scale]="deckScale()"
>
  @for (c of table().cards(); track c.uuid) {
    <ct-card
      class="card"
      [attr.data-testid]="'card-' + c.value"
      [suit]="c.suit"
      [value]="c.value"
      [face]="face()"
      [style.left.%]="c.x"
      [style.top.%]="c.y"
      [style.--ct-rot.deg]="c.rot"
      [style.--ct-card-scale]="c.scale"
      [style.z-index]="c.z"
      [style.transition-delay.ms]="c.dealDelay"
      [style.--ct-deal-delay]="c.dealDelay"
      [class.selected]="selectedUuid() === c.uuid"
      [class.special]="!c.inPile && !c.faceDown && isSpecial()(c.value)"
      [class.played]="c.inPile"
      [class.dealing]="c.dealing"
      [class.masked]="c.hidden"
      [class.face-down]="c.faceDown"
      [class.flip-in]="c.flip === 'in'"
      [class.flip-out]="c.flip === 'out'"
      [class.snap]="c.snap"
      (click)="click(c)"
      (mouseenter)="hover(c, true)"
      (mouseleave)="hover(c, false)"
    />
  }

  @for (f of table().flyers(); track f.id) {
    <ct-card
      class="card flyer"
      [class.flip-in]="f.flip === 'in'"
      [class.flip-out]="f.flip === 'out'"
      [class.popped]="f.glow"
      [suit]="f.suit"
      [value]="f.value"
      [face]="face()"
      [style.left.%]="f.x"
      [style.top.%]="f.y"
      [style.--ct-rot.deg]="f.rot"
      [style.--ct-card-scale]="f.scale"
    />
  }
</div>
